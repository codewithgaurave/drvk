<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5802e"/>
      <stop offset="30%" stop-color="#e1ae58"/>
      <stop offset="50%" stop-color="#fff3c4"/>
      <stop offset="70%" stop-color="#d19a40"/>
      <stop offset="100%" stop-color="#9f7228"/>
    </linearGradient>
    <linearGradient id="darkNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#011128"/>
      <stop offset="100%" stop-color="#000c1e"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" stroke="url(#goldGrad)" stroke-width="3" fill="url(#darkNavy)"/>
  <circle cx="50" cy="50" r="42" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>
  
  <!-- Crown -->
  <path d="M35 30 L41 36 L50 28 L59 36 L65 30 L64 40 L36 40 Z" fill="url(#goldGrad)"/>
  
  <!-- Monogram VSC -->
  <text x="50" y="65" text-anchor="middle" font-family="'Times New Roman', serif, Georgia, 'Plus Jakarta Sans'" font-size="24" font-weight="900" fill="url(#goldGrad)" letter-spacing="1.5">VSC</text>
  
  <!-- Laurel decoration -->
  <path d="M32 72 Q50 80 68 72" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
</svg>

